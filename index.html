<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contraption</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%236b3e22' width='32' height='32' rx='6'/%3E%3Ccircle fill='%23e24b3c' cx='16' cy='16' r='6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <span class="seal" aria-hidden="true"></span>
          <div>
            <h1>Contraption</h1>
            <p>Build the machine. Then let it run.</p>
          </div>
        </div>
        <div class="level-meta">
          <p id="level-kicker"></p>
          <h2 id="level-name"></h2>
          <p id="hint"></p>
        </div>
        <div class="controls">
          <button id="play" class="go" type="button">Play</button>
          <button id="stop" type="button">Stop</button>
          <button id="reset" type="button">Reset</button>
          <button id="hint-btn" type="button">Hint</button>
          <button id="slow" type="button">Slow</button>
          <button id="mute" type="button">Sound</button>
          <button id="build" type="button">Build</button>
          <button id="load-level" type="button" disabled>Load</button>
          <button id="save-level" type="button" disabled>Save level</button>
        </div>
      </header>
      <div id="stage-wrap">
        <canvas id="view" aria-label="Contraption table"></canvas>
        <p id="toast"></p>
      </div>
      <div id="shelf">
        <div class="shelf-label">
          <strong>Parts</strong>
          <span id="shelf-help">Drag onto the felt. Scroll or Q / E to rotate. Delete removes.</span>
        </div>
        <div id="builder-tools" class="is-hidden">
          <button id="layer-fixed" type="button" class="on">Fixed</button>
          <button id="layer-player" type="button">Player</button>
        </div>
        <div id="tray"></div>
      </div>
      <footer>
        <button id="prev" type="button">Previous</button>
        <div id="dots"></div>
        <button id="next" type="button">Next</button>
      </footer>
    </div>
    <div id="load-panel" class="is-hidden">
      <div class="card">
        <p class="kicker">Extra levels</p>
        <h3>Load a level</h3>
        <p id="load-empty">Nothing is saved in extra_levels yet.</p>
        <div id="load-list"></div>
        <div class="row">
          <button id="load-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <div id="modal" class="hidden">
      <div class="card">
        <p class="kicker">Machine complete</p>
        <h3 id="modal-title">It works</h3>
        <p id="modal-copy"></p>
        <div class="row">
          <button id="replay" type="button">Tinker again</button>
          <button id="modal-next" class="go" type="button">Next machine</button>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
